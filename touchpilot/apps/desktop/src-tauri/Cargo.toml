[package]
name = "toki-desktop"
version = "1.1.0"
description = "Toki desktop screen guidance shell"
authors = ["GargiGupta-io"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "toki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "image-png" is what lets the menu bar icon be decoded from a PNG at startup.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
cpal = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
toki-capture = { path = "../../../crates/capture" }

# Keychain access for the user's API key. Scoped to macOS because the Keychain
# is a macOS facility; the Windows build must not try to link Security.framework.
# Rust dependencies link statically, so this adds no bundled dylib and leaves
# the code signing story unchanged.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
