<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toki Candidate Fixture</title>
    <style>
      body {
        margin: 0;
        color: #f5f5f5;
        background: #141414;
        font: 16px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 760px;
        margin: 48px auto;
        padding: 32px;
        border: 1px solid #3b3b3b;
        border-radius: 16px;
        background: #202020;
      }

      h1 {
        margin-top: 0;
      }

      .row {
        display: flex;
        gap: 12px;
        margin: 24px 0;
      }

      button,
      a,
      input,
      select,
      textarea {
        min-height: 40px;
        border-radius: 10px;
        border: 1px solid #565656;
        color: #fff;
        background: #2d2d2d;
        padding: 8px 12px;
        font: inherit;
      }

      a {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }

      input,
      textarea,
      select {
        display: block;
        width: 100%;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Toki Candidate Fixture</h1>
      <p>This page exists only to verify DOM candidate extraction.</p>

      <div class="row">
        <button data-testid="primary-action">Create project</button>
        <button aria-label="Delete project">Delete</button>
        <a href="#settings" role="button">Open settings</a>
      </div>

      <label>
        Project name
        <input placeholder="Project name" data-testid="project-name-input" />
      </label>

      <label>
        Environment
        <select aria-label="Environment selector">
          <option>Development</option>
          <option>Production</option>
        </select>
      </label>

      <label>
        Notes
        <textarea placeholder="Add notes"></textarea>
      </label>
    </main>
  </body>
</html>
