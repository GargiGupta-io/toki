[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/accessibility",
  "crates/capture",
  "crates/gestures",
  "crates/input",
  "crates/overlay-native",
  "crates/safety",
  "crates/storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
